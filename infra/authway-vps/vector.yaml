# Authway-vps Vector agent — forward container logs → VictoriaLogs onelog-vps.
# Plan: 260821-1013-authway-vps-monitor-integration
# Convention: docs/observability-log-forwarding-convention.md — host="authway"

sources:
  docker:
    type: docker_logs
    include_containers:
      - authway-prod-zitadel-1
      - authway-prod-zitadel-login-1
      - authway-prod-postgres-1
      - authway-prod-traefik-1
    exclude_containers:
      - authway-prod-vector-1

  # Host syslog — systemd, cron, kernel, dmesg. Mù hoàn toàn nếu không có:
  # SSH intrusion → auth.log. Systemd fail → syslog. OOM → syslog kernel line.
  # ignore_older_secs=86400 để không backfill 1 file syslog vài GB khi restart.
  syslog_file:
    type: file
    include: [/var/log/syslog]
    ignore_older_secs: 86400
    read_from: end

  # SSH auth + sudo + PAM sessions. Security audit — attacker login attempts,
  # brute-force burst detection.
  auth_file:
    type: file
    include: [/var/log/auth.log]
    ignore_older_secs: 86400
    read_from: end

transforms:
  enrich:
    type: remap
    inputs: [docker]
    source: |
      raw_msg = string(.message) ?? ""

      # Parse structured JSON body if present (Zitadel emits JSON logs).
      parsed, err = parse_json(raw_msg)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed))
      }

      # VL requires _msg — set from raw message body.
      ._msg = raw_msg

      # Force host label to "authway" (see host convention doc).
      .host = "authway"

      # Service label = container name without stack prefix.
      cname = string!(.container_name)
      cname = replace(cname, "authway-prod-", "")
      cname = replace(cname, "-1", "")
      .service = cname

      # Drop noisy docker metadata to keep VL index lean.
      del(.container_id)
      del(.container_created_at)
      del(.image)
      del(.label)
      del(.stream)
      del(.message)

  # RFC5424 host log format: "2026-08-21T13:28:37 host service[pid]: message".
  # Single service label "syslog" — keeps VL stream cardinality bounded (1 stream
  # instead of one per systemd/cron/kernel/sudo/etc). Filter by _msg at query
  # time: `host:"authway" service:"syslog" _msg:*systemd*`.
  syslog_enrich:
    type: remap
    inputs: [syslog_file]
    source: |
      ._msg = string(.message) ?? ""
      .host = "authway"
      .service = "syslog"
      del(.file)
      del(.host_key)
      del(.message)

  auth_enrich:
    type: remap
    inputs: [auth_file]
    source: |
      ._msg = string(.message) ?? ""
      .host = "authway"
      .service = "auth"
      del(.file)
      del(.host_key)
      del(.message)

sinks:
  victorialogs:
    type: http
    inputs: [enrich, syslog_enrich, auth_enrich]
    # `_stream_fields=host,service` — declares (host, service) as the stream
    # tuple so VMUI's Stream Fields panel groups by these AND indexes them
    # separately. Without it, VL ingests with `_stream="{}"` (empty) and
    # host="authway" never appears in the VMUI stream field selector, even
    # though the field exists on every event. Same pattern as OneLog's Vector
    # (infra/vector/vector.yaml `_stream_fields: "service,host"`).
    uri: http://10.200.0.30:9428/insert/jsonline?_stream_fields=host,service
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    request:
      retry_attempts: 3
      timeout_secs: 30
