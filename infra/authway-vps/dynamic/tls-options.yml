# Traefik dynamic config — TLS options for OneLog central-rbac mTLS.
# Phase 06 Step 6 (Red Team Fix #6: same-hostname 2-TLS-options pattern).
# Reference: plans/260826-1644-central-rbac-hardening-and-self-service/phase-06-security-foundation.md
#
# IMPORTANT: verify via Step 6a spike on lab BEFORE committing to prod.
# If pattern fails (Traefik selects by SNI hostname, not per-router), fallback = split hostnames:
#   - rbac-webhook.<domain>  → mtls-optional
#   - rbac-internal.<domain> → strict-mtls
# Update router hostnames + DNS accordingly.

tls:
  options:
    # STRICT: require + verify client cert. Applied to /v1/resolve + /v1/admin/*
    strict-mtls:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256           # TLS 1.3
        - TLS_AES_256_GCM_SHA384           # TLS 1.3
        - TLS_CHACHA20_POLY1305_SHA256     # TLS 1.3
      clientAuth:
        # step-ca intermediate CA — clients must present cert signed by this CA
        caFiles:
          - /run/step-ca/intermediate_ca.crt
        clientAuthType: RequireAndVerifyClientCert
      sniStrict: true

    # OPTIONAL: allow no-cert. Applied to /webhooks/pre-token (Zitadel HMAC-signed) + /health
    mtls-optional:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      clientAuth:
        clientAuthType: NoClientCert
      sniStrict: true
