name: authway-prod

networks:
  # Internal: app containers only. NEVER expose to host 0.0.0.0.
  internal:
    driver: bridge
  edge:
    driver: bridge

volumes:
  postgres-data:
  # v4: shared bootstrap dir — setup writes login-client PAT, login sidecar reads
  zitadel-bootstrap:
  traefik-logs:
  # Phase 06 central-rbac hardening: step-ca root/intermediate CA + config
  # Root CA key MUST be Age-encrypted + backed up offline immediately after first init
  # (Validation Session 1 Decision — reuse OneLog backup-age.pub pattern)
  step-ca-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    # NO ports: published — internal docker network only
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zitadel-init:
    # Idempotent init: creates schema + admin
    image: ghcr.io/zitadel/zitadel:v4.16.1
    restart: "no"
    user: "0"
    networks: [internal]
    command: ["init", "--config", "/zitadel-config.yaml"]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    volumes:
      - ./zitadel-config.runtime.yaml:/zitadel-config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-setup:
    # Bootstrap default org + admin user. Runs after init.
    image: ghcr.io/zitadel/zitadel:v4.16.1
    restart: "no"
    user: "0"
    networks: [internal]
    command:
      - setup
      - --masterkey
      - ${ZITADEL_MASTERKEY}
      - --tlsMode
      - disabled
      - --config
      - /zitadel-config.yaml
      - --steps
      - /zitadel-steps.yaml
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN}
      ZITADEL_INSTANCEHOSTHEADERS: x-forwarded-host,x-zitadel-instance-host
      ZITADEL_PUBLICHOSTHEADERS: x-forwarded-host,x-zitadel-public-host
      # HTTP-only: port 80, no TLS
      ZITADEL_EXTERNALPORT: 80
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      # HTTP scheme for Login V2 base URI
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://${ZITADEL_EXTERNAL_DOMAIN}/ui/v2/login/
    volumes:
      - ./zitadel-config.runtime.yaml:/zitadel-config.yaml:ro
      - ./zitadel-steps.runtime.yaml:/zitadel-steps.yaml:ro
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-init:
        condition: service_completed_successfully

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.1
    restart: unless-stopped
    user: "0"
    networks:
      internal:
        aliases:
          - authway-vps.local
      edge: {}
    # Expose Prometheus metrics on host private network for onelog-vps vmagent scrape.
    # Zitadel binds :8080 internally; :2112 chosen to parallel Prometheus exporter convention.
    ports:
      - "10.200.0.125:2112:8080"
    command:
      - start
      - --masterkey
      - ${ZITADEL_MASTERKEY}
      - --tlsMode
      - disabled
      - --config
      - /zitadel-config.yaml
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN}
      ZITADEL_INSTANCEHOSTHEADERS: x-forwarded-host,x-zitadel-instance-host
      ZITADEL_PUBLICHOSTHEADERS: x-forwarded-host,x-zitadel-public-host
      # HTTP-only: port 80, no TLS
      ZITADEL_EXTERNALPORT: 80
      ZITADEL_EXTERNALSECURE: "false"
      # v4 OIDC/SAML: redirect login flows → Login V2 sidecar (HTTP scheme)
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNAL_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://${ZITADEL_EXTERNAL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNAL_DOMAIN}/ui/v2/login/login?samlRequest=
    volumes:
      - ./zitadel-config.runtime.yaml:/zitadel-config.yaml:ro
    depends_on:
      zitadel-setup:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=authway-prod_edge"
      # Exclude /ui/v2/login — route to zitadel-login sidecar instead
      - "traefik.http.routers.zitadel.rule=Host(`${ZITADEL_EXTERNAL_DOMAIN}`) && !PathPrefix(`/ui/v2/login`)"
      - "traefik.http.routers.zitadel.entrypoints=web"
      - "traefik.http.routers.zitadel.tls=false"
      - "traefik.http.routers.zitadel.priority=100"
      # fix-idps-scheme@file rewrites /idps/callback Location header https → http
      # (workaround Zitadel Next.js hardcoded scheme — see dynamic/middlewares.yml)
      - "traefik.http.routers.zitadel.middlewares=ratelimit-auth@file,fix-idps-scheme@file"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
      - "traefik.http.services.zitadel.loadbalancer.server.scheme=h2c"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/zitadel-config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # v4 Login V2 sidecar — Next.js app serving /ui/v2/login/*
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.1
    restart: unless-stopped
    user: "0"
    networks: [internal, edge]
    environment:
      # ZITADEL_API_URL uses external URL (via Traefik) so login sidecar emits
      # consistent CSP headers pointing at the same origin as the browser sees.
      # Previously http://authway-vps.local:8080 caused broken images: browser
      # blocked fetches from the internal alias (unresolvable from client).
      ZITADEL_API_URL: http://${ZITADEL_EXTERNAL_DOMAIN}
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # HTTP: no X-Forwarded-Proto:https override
      CUSTOM_REQUEST_HEADERS: "Host:${ZITADEL_EXTERNAL_DOMAIN},X-Forwarded-Host:${ZITADEL_EXTERNAL_DOMAIN},X-Forwarded-Proto:http"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=authway-prod_edge"
      - "traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_EXTERNAL_DOMAIN}`) && PathPrefix(`/ui/v2/login`)"
      - "traefik.http.routers.zitadel-login.entrypoints=web"
      - "traefik.http.routers.zitadel-login.tls=false"
      - "traefik.http.routers.zitadel-login.priority=250"
      # strip-hsts: Zitadel v4 login container hardcodes HSTS max-age=2y + preload
      # → Chrome cache force HTTPS upgrade → /idps/callback redirect fails ERR_CONNECTION_REFUSED
      # on plain-HTTP deployments. Strip HSTS at Traefik until fixed upstream.
      - "traefik.http.middlewares.strip-hsts-login.headers.customresponseheaders.Strict-Transport-Security="
      - "traefik.http.routers.zitadel-login.middlewares=ratelimit-auth@file,strip-hsts-login"
      - "traefik.http.services.zitadel-login.loadbalancer.server.port=3000"

  traefik:
    # v3.7+ required: Docker Engine 29+ raised minAPIVersion to 1.40; Traefik v3.2/v3.3
    # ships with Docker SDK that defaults to 1.24 and fails. v3.7 ships with updated SDK.
    image: traefik:3.7
    restart: unless-stopped
    networks: [edge]
    # No DOCKER_API_VERSION override — Traefik v3.2 negotiates Docker API version automatically
    ports:
      - "80:80"
      # Sectigo wildcard *.000nethost.com TLS cert (dynamic/certs-000nethost.yml)
      - "443:443"
      # Phase 4-5 IP-first review mode (V6 locked 2026-08-25): bind private IP only, not 0.0.0.0
      - "10.200.0.125:8082:8082"
      # Dashboard only reachable via local SSH tunnel
      - "127.0.0.1:8088:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
      - traefik-logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ─── Observability sidecars (plan 260821-1013-authway-vps-monitor-integration) ───
  # Scraped by onelog-vps vmagent (10.200.0.30) over private network.
  # All ports bound to 10.200.0.125 only — never public.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "10.200.0.125:9100:9100"
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      # host 8081 → container 8080 (Zitadel already binds container :8080)
      - "10.200.0.125:8081:8080"
    networks: [internal]

  vector:
    image: timberio/vector:0.42.0-alpine
    restart: unless-stopped
    # Run as root to read /var/log/syslog + /var/log/auth.log (mode 640 syslog:adm).
    # No other file writes; container itself has no persistent state.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      # Host syslog + auth.log forwarding (plan 260821-1013 follow-up).
      # Read-only mount — Vector only tails, never writes.
      - /var/log:/var/log:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    networks: [internal]

  # Mailhog for dev/test. Replace with real SMTP relay creds in Zitadel config for full prod.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks: [internal]
    ports:
      - "127.0.0.1:8025:8025"

  # ─── Phase 06 central-rbac hardening: step-ca sidecar (mTLS PKI) ───
  # Plan: plans/260826-1644-central-rbac-hardening-and-self-service/phase-06-security-foundation.md
  # PoC-verified 2026-08-27 (digest a2b17872...bc8270 = step-ca 0.30.2)
  #
  # First-boot: auto-inits via DOCKER_STEPCA_INIT_* env vars. Reads password from
  #   /root/.secrets/step-ca-password on host (0400, root-only), mounted via env_file.
  # After first init: MUST backup root_ca_key via Age-encrypt + offline storage.
  #   See docs/deployment-central-rbac-mtls.md § "Root key backup step".
  step-ca:
    image: smallstep/step-ca@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    restart: unless-stopped
    networks: [internal]
    ports:
      # Bind only on private IP — cross-VPS callers access via 10.200.0.125:9000
      - "10.200.0.125:9000:9000"
    volumes:
      - step-ca-data:/home/step
    environment:
      DOCKER_STEPCA_INIT_NAME: "OneLog Central RBAC CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,rbac.internal.local,10.200.0.125"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "admin"
      # Password provided via env_file (NOT hardcoded in compose)
      # File must exist at /root/.secrets/step-ca.env with STEP_CA_PASSWORD=...
      # Auto-init only reads on first-boot; can be removed after init if desired.
    env_file:
      - /root/.secrets/step-ca.env
    healthcheck:
      # Use SAN-matching hostname: init'd with step-ca in DNS_NAMES (localhost is NOT in SAN).
      # Docker internal DNS resolves `step-ca` to this container's own network alias.
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://step-ca:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: journald
